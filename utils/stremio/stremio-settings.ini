[General]
CloseOnExit=0
UseDarkTheme=1
ThumbFastHeight=0
PauseOnMinimize=1
PauseOnLostFocus=0
AllowZoom=0
[MPV]
VideoOutput=gpu-next
InitialVolume=100
; -1 follows mpv.conf; 0 disables blur; 1 enables blur with gpu-next.
; The tray menu and Ctrl+B save an explicit preference here.
BorderBlurEnabled=-1
